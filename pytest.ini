[pytest]
DJANGO_SETTINGS_MODULE = interview_project.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --nomigrations
    --reuse-db
    --cov=authentication
    --cov=profiles
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70

